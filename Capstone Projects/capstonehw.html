<!DOCTYPE html>
<html>
    <head>
        <title>Navbar</title>
        <style>

            body {
                margin: 0;
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: #162e97;
            }
            .topnav a {
                float: left;
                color: black;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover{
                background-color:#868bbe;
                color: rgb(77, 40, 40);
            }
            .topnav a:active{
                background-color:#181e57;
                color: rgb(153, 58, 58);
            }
        </style>
        </head>
        <body>
            <div class="topnav">
                <a class="active" href="#home">Home</a>
                <a href="#">About Us</a>
                <a href="#">Gallery</a>
                <a href="#">Contact Us</a>
                
            </div>
            <section>
                <img class="mySlides" src="windows3.1.jpg" style="height:500px">
                <img class="mySlides" src="windows95.jpg" style="height:500px">
                <img class="mySlides" src="windows98.jpg" style="height:500px">
                <img class="mySlides" src="windows2000.jpg" style="height:500px">
                <img class="mySlides" src="windowsME.jpg" style="height:500px">
                <img class="mySlides" src="windowsXP.jpg" style="height:500px">
                <img class="mySlides" src="windowsvista.jpg" style="height:500px">
                <img class="mySlides" src="windows7.jpg" style="height:500px">
                <img class="mySlides" src="windows8.jpg" style="height:500px">
                <img class="mySlides" src="windows10.jpg" style="height:500px">
                <img class="mySlides" src="windows11.jpg" style="height:500px">
            </section>
            <script>
                //Automatic Slideshow - change image in every 3 seconds.
                var myIndex =  0;
                carousel();

                function carousel() {
                    var i;
                    var x = document.getElementsByClassName("mySlides");
                    for (i= 0; i < x.length; i++) {
                        x[i].style.display = "none";
                    }
                    myIndex++;
                    if (myIndex > x.length) {myIndex = 1}
                    x[myIndex-1].style.display = "block";
                    setTimeout(carousel, 100);
                }
            </script>
        </body>
</html>
