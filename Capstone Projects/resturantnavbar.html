<!DOCTYPE html>
<html>
    <head>
        <title>Navbar</title>
        <style>

            body {
                margin: 0;
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: #976e16;
            }
            .topnav a {
                float: left;
                color: black;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover{
                background-color:#d3be63;
                color: rgb(77, 40, 40);
            }
            .topnav a:active{
                background-color:#755c07;
                color: rgb(153, 58, 58);
            }
        </style>
        </head>
        <body>
            <div class="topnav">
                <a class="active" href="#home">Your Cart</a>
                <a href="#">Open Resturant</a>
                <a href="#">Menu</a>
                <a href="#">Your Orders</a>
                
            </div>
        </body>
</html>
